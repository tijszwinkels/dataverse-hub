# Dataverse Hub configuration
# Copy to hub.toml and adjust as needed.
# Environment variables override values set here.

# "root" (authoritative) or "proxy" (cache + forward)
# mode = "proxy"

# Upstream hub URL (proxy mode only)
# upstream_url = "https://dataverse001.net"

# What to forward upstream in proxy mode:
# "public" (default) — only dataverse001 objects
# "all" — all objects, including identity-realm and shared-realm
# upstream_push = "public"

# Listen address
# addr = ":5678"

# Object store directory
# store_dir = "./dataverse001"

# Rate limiting
# rate_limit_per_min = 120
# rate_limit_per_day = 20000

# PAGE ref used as default HTML viewer for browser requests
# default_viewer_ref = "AxyU5_5vWmP2tO_klN4UpbZzRsuJEvJTrdwdg_gODxZJ.b3f5a7c9-2d4e-4f60-9b8a-0c1d2e3f4a5b"

# Keep old revisions in bk/ on update
# backup_enabled = true

# Auth token / session cookie lifetime (Go duration string)
# auth_token_expiry = "168h"

# Base domain for virtual hosting (default: "localhost")
# Required for vhost_mode = "redirect" or "isolate".
# base_domain = "dataverse001.net"

# Virtual hosting mode:
# - "off": disable host-based routing and on-demand TLS approval
# - "redirect": resolve _dv.* hosts, but redirect browsers to the shared base-domain path
# - "isolate": give each PAGE its own canonical host/origin
# vhost_mode = "isolate"

# DNS TXT record cache TTL for custom domain resolution
# txt_cache_ttl = "5m"

# Freenet write-through mirror.
#
# When enabled, every *public* dataverse001 object this hub accepts is queued
# and asynchronously republished to Freenet by an external publish command
# (snapshot PUT -> head PUT -> poke each relation target). Identity-realm,
# shared-realm and server-public objects are never mirrored.
#
# This is write-only: nothing here is ever consulted to serve a read, because a
# Freenet not-found can stall for minutes.
#
# Publishing is irreversible — a snapshot is public and permanent. Leave this
# off unless you mean it.
#
# [freenet]
# enabled = false
#
# Absolute path to the publish command. Run directly, never through a shell,
# and given exactly one argument: the path to a file holding the envelope.
# publish_cmd = "/opt/freenet/scripts/publish-v2.sh"
#
# Where pending/inflight/failed mirror jobs live.
# Defaults to <store_dir>/freenet-queue.
# queue_dir = "./dataverse001/freenet-queue"
#
# Wall-clock budget for one publish, as a Go duration string. On expiry the
# command and its whole process group are killed.
# timeout = "15m"
#
# Retry attempts *after* the initial one, with exponential backoff (30s
# doubling, capped at 10m). retries = 3 means up to 4 publish attempts.
# Publishes are idempotent, so retrying is always safe.
# retries = 3

# Shared realms — grant a group of pubkeys shared read access to objects.
# Realm names conventionally use "{owner-pubkey}.{Name}" but any string works.
# Edit and send SIGHUP to reload without restart.
#
# [realms."AxyU5_5vWmP2tO_klN4UpbZzRsuJEvJTrdwdg_gODxZJ.MyTeam"]
# members = [
#   "AxyU5_5vWmP2tO_klN4UpbZzRsuJEvJTrdwdg_gODxZJ",
#   "BzxY7_other_pubkey_here",
# ]
